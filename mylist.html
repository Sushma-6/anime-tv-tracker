<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My List - Anime Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300">
 

  <!-- Page Container -->
  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">My Watchlist</h1>

    <!-- Tabs -->
    <div class="flex space-x-4 border-b mb-6">
      <button class="tab-btn border-b-2 border-purple-600 text-purple-600 pb-2" data-tab="all">All</button>
      <button class="tab-btn text-gray-600 pb-2" data-tab="watching">Watching</button>
      <button class="tab-btn text-gray-600 pb-2" data-tab="completed">Completed</button>
      <button class="tab-btn text-gray-600 pb-2" data-tab="dropped">Dropped</button>
    </div>

    <div class="flex space-x-4 mb-6">
  <select id="genreFilter" class="border p-2 rounded">
    <option value="">All Genres</option>
    <option value="action">Action</option>
    <option value="adventure">Adventure</option>
    <option value="fantasy">Fantasy</option>
  </select>

  <select id="languageFilter" class="border p-2 rounded">
    <option value="">All Languages</option>
    <option value="japanese">Japanese</option>
    <option value="english">English</option>
  </select>

  <select id="yearFilter" class="border p-2 rounded">
    <option value="">All Years</option>
    <option value="2020">2020</option>
    <option value="2021">2021</option>
    <option value="2022">2022</option>
    <option value="2023">2023</option>
    <option value="2024">2024</option>
    <option value="2025">2025</option>
  </select>
</div>



    <!-- Tab Content -->
    <div id="tab-all" class="tab-content grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Demon Slayer -->
      <a href="demon-slayer.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/1286/99889.jpg" alt="Demon Slayer" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">Demon Slayer</h2>
          <p class="text-sm text-gray-600">Progress: 22/44</p>
        </div>
      </a>

      <!-- One Piece -->
      <a href="one-piece.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/6/73245.jpg" alt="One Piece" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">One Piece</h2>
          <p class="text-sm text-gray-600">Progress: 1050/1100</p>
        </div>
      </a>

      <!-- Attack on Titan -->
      <a href="attack-on-titan.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/10/47347.jpg" alt="Attack on Titan" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">Attack on Titan</h2>
          <p class="text-sm text-gray-600">Progress: 75/75</p>
        </div>
      </a>

      <!-- Boruto -->
      <a href="boruto.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/1208/94745.jpg" alt="Boruto" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">Boruto</h2>
          <p class="text-sm text-gray-600">Dropped</p>
        </div>
      </a>
    </div>

    <!-- Watching Tab -->
    <div id="tab-watching" class="tab-content hidden grid grid-cols-1 md:grid-cols-3 gap-6">
      <a href="demon-slayer.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/1286/99889.jpg" alt="Demon Slayer" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">Demon Slayer</h2>
          <p class="text-sm text-gray-600">Watching</p>
        </div>
      </a>
    </div>

    <!-- Completed Tab -->
    <div id="tab-completed" class="tab-content hidden grid grid-cols-1 md:grid-cols-3 gap-6">
      <a href="attack-on-titan.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/10/47347.jpg" alt="Attack on Titan" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">Attack on Titan</h2>
          <p class="text-sm text-gray-600">Completed</p>
        </div>
      </a>
    </div>

    <!-- Dropped Tab -->
    <div id="tab-dropped" class="tab-content hidden grid grid-cols-1 md:grid-cols-3 gap-6">
      <a href="boruto.html" class="bg-white shadow rounded-lg overflow-hidden hover:shadow-lg transition">
        <img src="https://cdn.myanimelist.net/images/anime/1208/94745.jpg" alt="Boruto" class="w-full h-48 object-cover">
        <div class="p-4">
          <h2 class="text-lg font-semibold">Boruto</h2>
          <p class="text-sm text-gray-600">Dropped</p>
        </div>
      </a>
    </div>

  </div>

  <!-- JS for Tabs -->
  <script>
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active classes
        tabButtons.forEach(b => b.classList.remove('border-purple-600', 'text-purple-600'));
        tabButtons.forEach(b => b.classList.add('text-gray-600'));
        tabContents.forEach(content => content.classList.add('hidden'));

        // Add active to clicked
        btn.classList.add('border-purple-600', 'text-purple-600');
        btn.classList.remove('text-gray-600');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
      });
    });
  </script>

  <script>
const genreFilter = document.getElementById("genreFilter");
const languageFilter = document.getElementById("languageFilter");
const yearFilter = document.getElementById("yearFilter");

function filterAnime() {
  const selectedGenre = genreFilter.value.toLowerCase();
  const selectedLanguage = languageFilter.value.toLowerCase();
  const selectedYear = yearFilter.value;

  const cards = document.querySelectorAll(".anime-card");

  cards.forEach(card => {
    const genre = card.getAttribute("data-genre")?.toLowerCase();
    const language = card.getAttribute("data-language")?.toLowerCase();
    const year = card.getAttribute("data-year");

    let show = true;

    if (selectedGenre && genre !== selectedGenre) show = false;
    if (selectedLanguage && language !== selectedLanguage) show = false;
    if (selectedYear && year !== selectedYear) show = false;

    card.style.display = show ? "block" : "none";
  });
}

genreFilter.addEventListener("change", filterAnime);
languageFilter.addEventListener("change", filterAnime);
yearFilter.addEventListener("change", filterAnime);
</script>
</body>


</body>
</html>
