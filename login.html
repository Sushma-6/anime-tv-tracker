<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — AnimeTracker</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="center-page">
  <main class="auth-card">
    <div class="brand-row">
      <img src="assets/images/logo.png" alt="logo" class="logo" />
      <h2>AnimeTracker</h2>
    </div>

    <h3 class="mb-sm">Log in to your account</h3>
    <form id="login-form" class="form"> <!-- ✅ matches script.js -->
      <label>Email
        <input id="email" type="email" required /> <!-- ✅ matches script.js -->
      </label>
      <label>Password
        <input id="password" type="password" required /> <!-- ✅ matches script.js -->
      </label>

      <div class="form-row">
        <button type="submit" class="btn btn-primary">Login</button>
        <a href="signup.html" class="link-muted">Create an account</a>
      </div>
    </form>
    <p class="muted small">Your login is secured by Supabase 🔒</p>
  </main>

  <!-- Load your app logic -->
  <script src="script.js"></script>
</body>
</html>
