<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — AnimeTracker</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="center-page">
  <main class="auth-card">
    <div class="brand-row">
      <img src="assets/images/logo.png" alt="logo" class="logo" />
      <h2>AnimeTracker</h2>
    </div>

    <h3 class="mb-sm">Create an account</h3>
   <form id="signup-form" class="form"> <!-- changed -->
  <label>Full Name
    <input id="signup-name" required /> <!-- changed -->
  </label>
  <label>Email
    <input id="signup-email" type="email" required /> <!-- changed -->
  </label>
  <label>Password
    <input id="signup-password" type="password" required /> <!-- changed -->
  </label>
  <label>Confirm Password
    <input id="signup-password2" type="password" required /> <!-- changed -->
  </label>

  <div class="form-row">
    <button type="submit" class="btn btn-primary">Sign Up</button>
    <a href="login.html" class="link-muted">Already have an account?</a>
  </div>
</form>

    <p class="muted small">Your account is secure with Supabase 🔒</p>
  </main>

  <!-- Load your app logic -->
  <script src="script.js"></script>
</body>
</html>
